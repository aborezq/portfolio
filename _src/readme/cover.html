<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- The GitHub profile's cover (github.com/aborezq): the site's magazine cover,
     1600 × 720. ?theme=light for GitHub's light mode. Built by _src/readme.js. -->
<title>README cover</title>
<style>
  @font-face { font-family: "Anton"; font-weight: 400; src: url("../../assets/fonts/anton-latin.woff2") format("woff2"); }
  @font-face { font-family: "Inter"; font-weight: 400 700; src: url("../../assets/fonts/inter-latin.woff2") format("woff2"); }

  :root { --bg: #0b0a08; --word: #e8dcc0; --text: #f1ece1; --muted: #a39c8d; --gold: #d9b36a; --glow: rgb(217 179 106 / 0.2); --shadow: rgb(0 0 0 / 0.55); }
  :root.light { --bg: #f6f1e7; --word: #1f1a12; --text: #201c14; --muted: #6d6455; --gold: #80520d; --glow: rgb(217 179 106 / 0.3); --shadow: rgb(60 40 10 / 0.28); }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1600px; height: 720px; overflow: hidden; }
  body {
    position: relative;
    font-family: "Inter", sans-serif;
    color: var(--text);
    background: radial-gradient(660px 540px at 50% 36%, var(--glow), transparent 70%), var(--bg);
  }

  .meta { position: absolute; top: 46px; left: 64px; right: 64px; display: flex; justify-content: space-between; align-items: center; }
  .loc { font-size: 20px; font-weight: 600; letter-spacing: 0.18em; color: var(--muted); }
  .mark { font-family: "Anton", sans-serif; font-size: 42px; letter-spacing: 0.02em; color: var(--word); }
  .mark i { font-style: normal; color: var(--gold); }

  /* As on the site: the tops of the capitals just above the portrait's frame,
     so the head rises into the bottom of the letters. */
  .word {
    position: absolute; left: 0; right: 0; top: 122px;
    font-family: "Anton", sans-serif; font-size: 293px; line-height: 0.95; letter-spacing: 0.01em;
    text-align: center; color: var(--word);
  }
  .portrait {
    position: absolute; left: 50%; top: 145px; height: 772px; transform: translateX(-50%);
    -webkit-mask-image: linear-gradient(to bottom, #000 48%, transparent 74%), linear-gradient(to right, transparent, #000 11%, #000 89%, transparent);
    -webkit-mask-composite: source-in;
    mask-image: linear-gradient(to bottom, #000 48%, transparent 74%), linear-gradient(to right, transparent, #000 11%, #000 89%, transparent);
    mask-composite: intersect;
    mask-repeat: no-repeat;
    filter: drop-shadow(0 18px 30px var(--shadow));
  }

  .foot { position: absolute; left: 64px; right: 64px; bottom: 46px; display: flex; justify-content: space-between; align-items: flex-end; }
  .avail { display: flex; align-items: center; gap: 12px; font-size: 17px; font-weight: 700; letter-spacing: 0.1em; color: var(--gold); }
  .avail::before { content: ""; width: 11px; height: 11px; border-radius: 50%; background: var(--gold); }
  .name { margin-top: 12px; font-size: 32px; font-weight: 700; }
  .role { margin-top: 4px; font-size: 19px; color: var(--muted); }
  .site { font-size: 23px; font-weight: 600; color: var(--gold); }
</style>
</head>
<body>
  <div class="meta"><span class="loc">GAZA, PALESTINE</span><span class="mark">MR<i>.</i> AWAD</span></div>
  <div class="word">PORTFOLIO</div>
  <img class="portrait" src="../../assets/profile-cutout.webp" alt="">
  <div class="foot">
    <div>
      <p class="avail">OPEN TO REMOTE WORK &amp; INTERNSHIPS</p>
      <p class="name">Mohammed R. Awad</p>
      <p class="role">Senior · Intelligent Systems &amp; Computer Engineering</p>
    </div>
    <p class="site">mohammedawad.online ↗</p>
  </div>
  <script>if (new URLSearchParams(location.search).get("theme") === "light") document.documentElement.classList.add("light");</script>
</body>
</html>
